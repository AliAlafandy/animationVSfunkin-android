# This is a basic workflow to help you get started with Actions

name: Build

# Controls when the action will run.
on: [push,pull_request,workflow_dispatch]

env:
  HAXE_VERSION: 4.2.5

# A workflow run is made up of one or 69 jobs that can run sequentially or in parallel
jobs:
  # This workflow dsoent contain a single job called "build"
  buildAndroid:
    name: buildAndroid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@main
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Setup Java JDK
        uses: actions/setup-java@main
        with:
          distribution: 'zulu'
          java-version: 18

      - name: Setup Android SDK
        uses: android-actions/setup-android@main

      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib --quiet install hxcpp > /dev/null
          haxelib --quiet install lime 8.0.1
          haxelib --quiet install openfl 9.2.1
          haxelib --never install flixel 5.2.2
          haxelib run lime setup flixel
          haxelib --quiet install flixel-tools 1.5.1
          haxelib --quiet install flixel-ui 2.5.0
          haxelib --quiet install hscript
          haxelib --quiet install flixel-addons 5.3.0
          haxelib --quiet install hxCodec
          haxelib --quiet install tjson 1.4.0
          haxelib git linc_luajit https://github.com/AlafandyPorting/linc_luajit-0.7.3.git --quiet
          haxelib git extension-androidtools https://github.com/AlafandyPorting/extension-androidtools.git --quiet
          haxelib git extension-webview https://github.com/Daninnocent/extension-webview.git --quiet
          haxelib list
      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION

      - name: Setup Lime
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Compile
        run: haxelib run lime build android --app-version="4.0.0-${{ github.run_id}}"

      - name: Publish Artifact
        uses: actions/upload-artifact@main
        with:
          name: androidBuild
          path: export/release/android/bin/app/build/outputs/apk/debug
